name: Challenge entries (zip upload)
description: Submit up to 10 challenge entries, one pattern per target, uploaded as a zip on the Challenge page
title: "Challenge entries"
labels: ["pattern-request", "batch-request", "challenge"]
body:
  - type: markdown
    attributes:
      value: |
        Upload your zip (a `patterns` file and a `targets` file) on the [Challenge page](https://adamslab-gibert.github.io/metamaterial-rig/challenge.html#upload). The page checks it and fills in the entries below. The rig tests the patterns one after another; each is scored against its target and added to the leaderboard.
  - type: textarea
    id: entries
    attributes:
      label: Entries (one per line, target then pattern)
      description: Filled in by the Challenge page. Each line is a target (T1 to T10) and a pattern (105 digits or 27 hex digits). At most one pattern per target.
      render: text
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      description: Briefly describe how you found these patterns (algorithm, model, data). Shown on the leaderboard. At least 20 characters.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Data sharing
      options:
        - label: I agree that the measured data, photos and this request are published openly under CC BY 4.0.
          required: true
