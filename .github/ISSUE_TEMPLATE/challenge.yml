name: Challenge entry
description: Submit one pattern for an inverse-design challenge target
title: "Challenge entry"
labels: ["pattern-request", "challenge"]
body:
  - type: markdown
    attributes:
      value: |
        Pick a target curve on the [rig page](https://adamslab-gibert.github.io/metamaterial-rig/challenge.html), design a pattern that you think reproduces it, and press **Submit to the challenge**. That fills in the target and the pattern below. The rig tests the pattern and the score (RMS force difference of the 200-point curves, in N) is posted here and on the leaderboard.
  - type: input
    id: name
    attributes:
      label: Your name
      description: Shown with your request and its results, so the lab and others can see whose patterns are being tested.
      placeholder: "e.g. Jane Smith (Purdue ME)"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: The challenge target, T1 to T10.
      placeholder: T1
    validations:
      required: true
  - type: input
    id: pattern
    attributes:
      label: Pattern (105 digits, 1 = insert)
      description: Bottom row first, left to right. Rows alternate 6 and 5 cells.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method
      description: Briefly describe how you found this pattern (for example the algorithm, model or data you used). Shown on the leaderboard. At least 20 characters.
      placeholder: "e.g. Nearest-neighbour search on the published curves, then a genetic algorithm that changes 1-3 cells per step, scored with a forward CNN trained on the data set."
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Data sharing
      options:
        - label: I agree that the measured data, photos and this request are published openly under CC BY 4.0.
          required: true
